<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 236 144" fill="none">
  <!-- Left/Center Cluster: Fanned Cards + Smartphone with Checkmark + Hand -->
  <g>
    <ellipse cx="82" cy="104" rx="54" ry="6" fill="var(--color-mocha)" fill-opacity="0.09" />

    <!-- Back Golden Card -->
    <g transform="rotate(-24 44 64)">
      <rect x="16" y="46" width="54" height="35" rx="5" fill="var(--color-secondary-container)" />
      <rect x="16" y="53" width="54" height="6" fill="var(--color-honey)" />
    </g>

    <!-- Front Terracotta Digital Card -->
    <g transform="rotate(-9 54 74)">
      <rect x="24" y="56" width="58" height="37" rx="5.5" fill="var(--color-clay)" />
      <rect x="31" y="65" width="10" height="8" rx="2" fill="var(--color-secondary-container)" />
      <rect
        x="31"
        y="79"
        width="28"
        height="3"
        rx="1.5"
        fill="var(--color-warm-milk)"
        fill-opacity="0.75"
      />
      <circle cx="71" cy="83" r="4" fill="var(--color-secondary-container)" fill-opacity="0.85" />
    </g>

    <!-- Smartphone with Payment Verified Screen -->
    <g transform="rotate(-6 92 54)">
      <rect x="70" y="10" width="44" height="86" rx="9" fill="var(--color-primary)" />
      <rect x="74" y="15" width="36" height="76" rx="6" fill="var(--color-warm-milk)" />
      <rect x="86" y="18.5" width="12" height="2.5" rx="1.25" fill="var(--color-craft-border)" />

      <!-- Checkmark Badge -->
      <circle cx="92" cy="45" r="12.5" fill="var(--color-sage)" fill-opacity="0.18" />
      <circle cx="92" cy="45" r="9.5" fill="var(--color-sage)" />
      <path
        d="M87.8 45 L90.8 48 L96.5 42"
        stroke="var(--color-warm-milk)"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Confirmed Payment Pill -->
      <rect x="80" y="68" width="24" height="8.5" rx="4.25" fill="var(--color-sage)" />
      <rect x="86" y="71.2" width="12" height="2" rx="1" fill="var(--color-warm-milk)" />
    </g>

    <!-- Hand & Cuff Holding Phone -->
    <path
      d="M111 52 C121 52 126 60 124 72 L132 76 L122 89 C114 87 107 82 105 75 Z"
      fill="var(--color-primary-fixed)"
    />
    <rect
      x="103"
      y="55"
      width="13"
      height="7.5"
      rx="3.75"
      transform="rotate(18 103 55)"
      fill="var(--color-primary-fixed-dim)"
    />
    <rect
      x="119"
      y="71"
      width="24"
      height="18"
      rx="7"
      transform="rotate(24 119 71)"
      fill="var(--color-sage)"
    />
  </g>

  <!-- Lower-Right Cluster (Below Contraentrega Badge): Coins + Wallet Pad + Pet -->
  <g>
    <ellipse cx="188" cy="133" rx="40" ry="6" fill="var(--color-mocha)" fill-opacity="0.11" />

    <!-- Angled Digital Transfer Pad -->
    <g transform="rotate(20 183 118)">
      <rect x="154" y="103" width="58" height="30" rx="6" fill="var(--color-primary)" />
      <rect x="158" y="106.5" width="50" height="23" rx="4" fill="var(--color-warm-milk)" />
      <rect x="163" y="109.5" width="36" height="17" rx="3" fill="var(--color-sage)" />
      <circle cx="171" cy="118" r="3" fill="var(--color-secondary-container)" />
      <rect
        x="177"
        y="116.5"
        width="16"
        height="3"
        rx="1.5"
        fill="var(--color-warm-milk)"
        fill-opacity="0.8"
      />
    </g>

    <!-- Floating & Rolling Golden S/ Coins -->
    <circle cx="156" cy="70" r="10.5" fill="var(--color-honey)" />
    <circle cx="156" cy="69.5" r="8" fill="var(--color-secondary-container)" />
    <rect x="154.6" y="65.5" width="2.8" height="8" rx="1.4" fill="var(--color-mocha)" />

    <circle cx="171" cy="95" r="8.5" fill="var(--color-honey)" />
    <circle cx="171" cy="94.5" r="6.5" fill="var(--color-secondary-container)" />
    <circle cx="171" cy="94.5" r="2.2" fill="var(--color-mocha)" />

    <!-- Playful Little Pet Tapping Coins -->
    <path
      d="M218 96 Q229 88 224 76"
      stroke="var(--color-caramel)"
      stroke-width="4.8"
      stroke-linecap="round"
    />
    <ellipse
      cx="206"
      cy="95"
      rx="15"
      ry="11.5"
      transform="rotate(-12 206 95)"
      fill="var(--color-caramel)"
    />
    <ellipse cx="203" cy="98" rx="8.5" ry="5.5" fill="var(--color-secondary-fixed)" />
    <ellipse
      cx="184"
      cy="96"
      rx="7"
      ry="4.2"
      transform="rotate(-15 184 96)"
      fill="var(--color-secondary-fixed)"
    />
    <ellipse cx="212" cy="107.5" rx="6" ry="4.2" fill="var(--color-caramel)" />

    <!-- Pet Head & Ears -->
    <path d="M182 67 L180 54 L191 62 Z" fill="var(--color-mocha)" />
    <path d="M198 62 L209 55 L206 68 Z" fill="var(--color-mocha)" />
    <circle cx="194" cy="75" r="13.5" fill="var(--color-caramel)" />
    <ellipse cx="192.5" cy="80" rx="8.5" ry="5.8" fill="var(--color-secondary-fixed)" />
    <circle cx="188" cy="73" r="2.1" fill="var(--color-primary)" />
    <circle cx="187.3" cy="72.3" r="0.7" fill="var(--color-warm-milk)" />
    <circle cx="198" cy="73" r="2.1" fill="var(--color-primary)" />
    <circle cx="197.3" cy="72.3" r="0.7" fill="var(--color-warm-milk)" />
    <ellipse cx="193" cy="77.5" rx="2.3" ry="1.6" fill="var(--color-mocha)" />
    <path
      d="M190 80.5 Q193 82.8 196 80.5"
      stroke="var(--color-mocha)"
      stroke-width="1.3"
      stroke-linecap="round"
    />
  </g>
</svg>
