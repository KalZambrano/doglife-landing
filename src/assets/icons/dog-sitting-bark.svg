<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 78" fill="none">
  <!-- Sombra suave en el suelo -->
  <ellipse cx="41" cy="71.5" rx="21" ry="3.5" fill="var(--color-roasted)" fill-opacity="0.24" />

  <!-- Cola alegre (sin atributo transform SVG para evitar saltos) -->
  <g class="dog-profile-tail">
    <path
      d="M52 59 C60 56 67 47 65 38 C64 34 59.5 36 58 42 C56.5 48 53.5 53 49.5 55.5 Z"
      fill="var(--color-caramel)"
    />
    <path
      d="M65 38 C64 34 59.5 36 58.3 41 C60.8 41.5 63.2 40.2 65 38 Z"
      fill="var(--color-warm-milk)"
    />
  </g>

  <!-- Cuerpo sentado de perfil (mirando a la izquierda) -->
  <g>
    <!-- Torso y lomo curvado -->
    <path
      d="M32.5 34.5 C41.5 34.5 51.5 43.5 54.5 57.5 C56 64.5 51.5 70 43.5 70 L32 70 C29 70 28 65 28.5 56.5 C29 46.5 28.5 38 32.5 34.5 Z"
      fill="var(--color-caramel)"
    />

    <!-- Pecho esponjoso color crema -->
    <path
      d="M30 37.5 C24.5 41.5 24 51.5 28.5 58.5 C32.5 56.5 35 50.5 34.5 44 C34.2 40.2 32.2 38 30 37.5 Z"
      fill="var(--color-warm-milk)"
    />

    <!-- Muslo / pata trasera plegada al sentarse -->
    <path
      d="M44 49.5 C50.5 49.5 55.5 55 55.5 61.5 C55.5 66.8 51 70 44.5 70 L37.5 70 C37.5 66 39.5 62.5 42 60 C39.5 56.5 40 50.5 44 49.5 Z"
      fill="var(--color-mocha)"
      fill-opacity="0.26"
    />
    <path
      d="M44.5 51 C50.2 51 54.5 55.8 54.5 61.8 C54.5 66.5 50.5 70 44.5 70 L38.5 70 C38.5 66.5 40.5 63.5 43 61.5 C40.5 58 41 52 44.5 51 Z"
      fill="var(--color-caramel)"
    />

    <!-- Pata delantera recta -->
    <path
      d="M29 50.5 C29 48.5 35.5 48.5 35.5 50.5 L35.5 68.5 L29 68.5 Z"
      fill="var(--color-caramel)"
    />

    <!-- Patitas (trasera y delantera) con acabado crema -->
    <path
      d="M36 69.5 C36 67 39 65.8 42.5 66.2 L44.5 70 L36 70 Z"
      fill="var(--color-warm-milk)"
    />
    <path
      d="M25.5 69.5 C25.5 66.5 29 65.2 33.5 65.8 L35.5 70 L25.5 70 Z"
      fill="var(--color-warm-milk)"
    />

    <!-- Collar artesanal y plaquita dorada -->
    <path
      d="M28.5 35 C33.5 38.2 40.5 39 45 36.8"
      stroke="var(--color-clay)"
      stroke-width="4"
      stroke-linecap="round"
    />
    <circle cx="27.5" cy="39.5" r="3" fill="var(--color-secondary-container)" />
    <circle cx="27.5" cy="39.5" r="1.3" fill="var(--color-honey)" />
  </g>

  <!-- Cabeza y hocico de perfil (mirando a la izquierda) -->
  <g class="dog-profile-head">
    <!-- Mandíbula inferior (se abre al ladrar) -->
    <g class="dog-profile-jaw">
      <!-- Lengüita rosada visible al abrir la boca -->
      <path
        d="M17.5 27.5 C17.5 30.8 21.5 31.8 25 29.5 L25 26.8 Z"
        fill="var(--color-clay)"
      />
      <!-- Quijada inferior -->
      <path
        d="M16.5 26.8 C16.2 30.5 21 32.5 28.5 31.8 L33.5 28.5 L28 26.2 Z"
        fill="var(--color-caramel)"
      />
      <path
        d="M16.8 27 C17.2 29.8 21.2 31.2 27.2 30.8 L28 26.8 Z"
        fill="var(--color-warm-milk)"
      />
    </g>

    <!-- Cráneo redondeado y hocico superior de perfil -->
    <path
      d="M45.5 22.5 C45.5 13.5 38.5 8.5 30.5 9.5 C26.2 10 23.5 12.8 21.8 16.8 L13.8 18.2 C11.2 18.7 10.2 21 10.8 23.5 C11.5 26.5 15.5 28.2 21.5 28.2 C25.2 28.2 27.5 27.2 29.5 27.8 L34 31.5 L42.5 32 C44.5 29 45.5 26 45.5 22.5 Z"
      fill="var(--color-caramel)"
    />

    <!-- Mancha crema suave en el hocico y mejilla -->
    <path
      d="M11.2 21.5 C13.5 21 17.5 21.8 20.5 24 C22.5 25.5 24.5 26.2 27.5 26.2 C26.2 27.6 23.8 28.2 20.8 28.2 C15.2 28.2 11.5 26.5 10.8 23.5 C10.6 22.7 10.8 22 11.2 21.5 Z"
      fill="var(--color-warm-milk)"
    />

    <!-- Comisura de sonrisa amigable -->
    <path
      d="M18.5 26.8 Q23.5 27.8 26.8 25.8"
      stroke="var(--color-primary)"
      stroke-width="1.35"
      stroke-linecap="round"
    />

    <!-- Nariz oscura en la punta del hocico con brillo -->
    <path
      d="M10.5 19.8 C10.5 18.2 12.2 17.5 14.5 17.8 C16.2 18 16.8 19.5 15.8 21.2 C14.8 22.8 12.8 23.2 11.4 22.2 C10.7 21.6 10.5 20.7 10.5 19.8 Z"
      fill="var(--color-primary)"
    />
    <ellipse cx="12.6" cy="19.1" rx="1.2" ry="0.7" fill="var(--color-warm-milk)" fill-opacity="0.75" />

    <!-- Ojo expresivo con doble brillo y ceja cálida -->
    <circle cx="27.2" cy="18.2" r="3" fill="var(--color-primary)" />
    <circle cx="26.2" cy="17.2" r="1.1" fill="var(--color-warm-milk)" />
    <circle cx="28.1" cy="19.1" r="0.5" fill="var(--color-warm-milk)" />
    <path
      d="M24.8 13.8 Q27.5 12.3 30.2 14.2"
      stroke="var(--color-mocha)"
      stroke-width="1.4"
      stroke-linecap="round"
    />

    <!-- Oreja caída natural en forma de gota (sin atributo transform SVG) -->
    <g class="dog-profile-ear">
      <path
        d="M35.5 13.5 C39.5 13 43.5 16.5 44.2 22.5 C44.8 28.5 42.2 33.8 38.2 34 C34.5 34.2 32.5 29.8 33.2 23.5 C33.8 18.2 33.2 13.8 35.5 13.5 Z"
        fill="var(--color-mocha)"
      />
      <path
        d="M36.8 16.5 C39.2 16.5 41.2 19.5 41.5 24 C41.8 27.8 40.2 31 38.2 31 C36.5 31 35.5 28 35.8 23.8 C36 19.8 35.5 16.5 36.8 16.5 Z"
        fill="var(--color-primary)"
        fill-opacity="0.35"
      />
    </g>
  </g>

  <!-- Ondas de ladrido frente al hocico -->
  <g class="dog-bark-waves" stroke="var(--color-secondary-container)" stroke-width="2.2" stroke-linecap="round">
    <path d="M7.2 15.5 C4.8 17.8 4.8 21.8 7.2 24.2" />
    <path d="M3.8 11.8 C0.5 16 0.5 23 3.8 27.2" />
    <line x1="8.2" y1="11" x2="5" y2="8" />
  </g>
</svg>
