    <!-- Paws -->
    <ellipse
      cx="146"
      cy="108"
      rx="6.2"
      ry="4.5"
      transform="rotate(14 146 108)"
      fill="var(--color-secondary-fixed)"
    />
    <ellipse cx="157" cy="132" rx="6.5" ry="4.2" fill="var(--color-secondary-fixed)" />
    <ellipse cx="172" cy="132" rx="6.5" ry="4.2" fill="var(--color-secondary-fixed)" />
  </g>
</svg>
