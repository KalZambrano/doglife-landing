    <path d="M102 84 L96 94 L109 89 Z" fill="var(--color-warm-milk)" />
    <circle cx="117" cy="73" r="19.5" fill="var(--color-warm-milk)" />
    <path d="M104.5 82.5 L100.5 89.5 L109.5 86.5 Z" fill="var(--color-sage)" />
    <circle cx="117" cy="73" r="16" fill="var(--color-sage)" />
    <path
      d="M111.8 66.8c.4-.9.9-1 1.4-1h1c.4 0 .8.1 1 .7.4.9 1.1 2.6 1.2 2.8.1.2.2.5 0 .8-.2.3-.4.6-.7.9-.2.2-.4.5-.2.9.4.7 1.3 1.9 2.7 2.8.5.3.8.3 1.1-.1.3-.4 1.1-1.3 1.4-1.7.3-.4.6-.3 1-.2.4.2 2.5 1.2 2.9 1.4.4.2.7.3.8.5.1.3.1 1.2-.4 2.1-.5.9-2 1.7-2.8 1.8-.8.1-1.7.1-2.8-.3-3.8-1.4-6.4-4.8-6.9-5.6-.5-.8-1.5-2.3-1.5-3.9 0-1.1.5-1.7.8-1.9Z"
