    <path d="M149 90 L146 75 L158 84 Z" fill="var(--color-caramel)" />
    <path d="M170 84 L182 75 L179 90 Z" fill="var(--color-caramel)" />
    <path d="M150.5 88 L148.5 78.5 L156.5 84.5 Z" fill="var(--color-primary-fixed-dim)" />
    <path d="M171.5 84.5 L179.5 78.5 L177.5 88 Z" fill="var(--color-primary-fixed-dim)" />

    <!-- Head -->
    <circle cx="164" cy="95" r="15.5" fill="var(--color-secondary-container)" />
    <ellipse cx="164" cy="100" rx="8.5" ry="6" fill="var(--color-warm-milk)" />
    <circle cx="158" cy="93.5" r="2.5" fill="var(--color-primary)" />
    <circle cx="157.2" cy="92.6" r="0.85" fill="var(--color-warm-milk)" />
    <circle cx="170" cy="93.5" r="2.5" fill="var(--color-primary)" />
    <circle cx="169.2" cy="92.6" r="0.85" fill="var(--color-warm-milk)" />
    <ellipse cx="164" cy="97.5" rx="2.8" ry="2" fill="var(--color-mocha)" />
    <path
      d="M160.5 101 Q164 103.8 167.5 101"
      stroke="var(--color-mocha)"
      stroke-width="1.5"
      stroke-linecap="round"
