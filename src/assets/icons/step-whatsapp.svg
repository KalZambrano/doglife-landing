    <!-- Cute cream pet face inside bubble -->
    <path d="M151 35 L150 25 L158 31 Z" fill="var(--color-warm-milk)" />
    <path d="M173 35 L174 25 L166 31 Z" fill="var(--color-warm-milk)" />
    <path d="M152.5 34 L151.8 27.8 L156.8 31.8 Z" fill="var(--color-primary-fixed-dim)" />
    <path d="M171.5 34 L172.2 27.8 L167.2 31.8 Z" fill="var(--color-primary-fixed-dim)" />
    <circle cx="162" cy="41.5" r="11.5" fill="var(--color-warm-milk)" />
