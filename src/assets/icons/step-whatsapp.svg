<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 212 148" fill="none">
  <!-- Soft ambient ground shadow -->
  <ellipse cx="110" cy="137" rx="82" ry="7.5" fill="var(--color-mocha)" fill-opacity="0.11" />

  <!-- Tilted Smartphone -->
  <g transform="rotate(-4 118 74)">
    <rect x="91" y="15" width="60" height="115" rx="12" fill="var(--color-roasted)" />
    <rect x="88" y="14" width="60" height="115" rx="12" fill="var(--color-primary)" />
    <rect x="92.5" y="19.5" width="51" height="104" rx="8" fill="var(--color-warm-milk)" />
