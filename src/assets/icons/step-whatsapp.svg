      stroke="var(--color-primary)"
      stroke-width="1.8"
      stroke-linecap="round"
    />

    <!-- Nose & bright eyes -->
    <ellipse cx="62.5" cy="67.5" rx="4.8" ry="3.4" fill="var(--color-primary)" />
    <ellipse cx="61.2" cy="66.5" rx="1.5" ry="0.9" fill="var(--color-warm-milk)" fill-opacity="0.65" />
    <circle cx="52.5" cy="60" r="3.3" fill="var(--color-primary)" />
    <circle cx="51.4" cy="58.8" r="1.1" fill="var(--color-warm-milk)" />
    <circle cx="71" cy="60" r="3.3" fill="var(--color-primary)" />
    <circle cx="69.9" cy="58.8" r="1.1" fill="var(--color-warm-milk)" />

    <!-- Paws -->
    <ellipse cx="49" cy="131.5" rx="8" ry="5" fill="var(--color-warm-milk)" />
    <ellipse cx="69" cy="131.5" rx="7.5" ry="5" fill="var(--color-warm-milk)" />
    <ellipse
